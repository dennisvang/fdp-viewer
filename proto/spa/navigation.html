<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>navigation api</title>
</head>
<body>
<div id="container"></div>

<script type="module">

    const PARAM_FDP = "fdp";

    const container = document.getElementById("container");

    // listen for navigation events
    navigation.addEventListener("navigate", (event) => {
        console.warn("nav event detected: %s, %s", event.navigationType, event.destination.url)
    });

    const fdpUrl= getFdpUrl();

    /** returns a valid fdp url, requesting one from the user if not found in the url query */
    function getFdpUrl() {
        // here we assume that the query param is valid if it exists...
        return getFdpUrlFromQuery() || getFdpUrlFromUser();
    }

    /** returns the value of the fdp query param, assuming this is a url */
    function getFdpUrlFromQuery() {
        // https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams#parsing_window.location
        const url = new URLSearchParams(window.location.search).get(PARAM_FDP);
        // update container
        container.innerText = url;
        return url;
    }

    /** returns a valid url from user input prompt */
    function getFdpUrlFromUser() {
        let url;
        while (!url) {
            try {
                // validate
                url = new URL(window.prompt("please specify a valid fdp url", "https://fdp.example.org")).href;
                console.debug("valid url entered: %s", url)
            } catch {
                // reset to try again
                url = null;
            }
        }
        // add the fdp url to the query string for the current location (using set instead of append to prevent multiple)
        const location = new URL(window.location);
        location.searchParams.set("fdp", url);
        // trigger navigation event with the updated query, but do not make a new history entry (replace the current one)
        navigation.navigate(location, {"history": "replace"});
        // return for convenience
        return url;
    }

</script>

</body>
</html>
