<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>navigation api</title>
</head>
<body>
<div id="container"></div>

<script type="module">

    const PARAM_FDP = "fdp";

    const container = document.getElementById("container");

    // listen for navigation events
    navigation.addEventListener("navigate", (event) => {
        console.warn("nav event detected: %s, %s", event.navigationType, event.destination.url)
    });

    // run the main function
    main();

    /** renders mock page content based on the fdp url */
    function main() {
        // get url however we can
        const resourceUrl = getFdpUrl();
        // mock routing
        const rootUrl = "https://fdp.example.org";
        const catalogUrl = rootUrl + "/catalog/1";
        const externalUrl = "https://other.example.org"
        let internalUrl = "no url";
        if ([rootUrl, rootUrl + "/"].includes(resourceUrl)) {
            internalUrl = catalogUrl;
        } else if (resourceUrl === catalogUrl) {
            internalUrl = rootUrl;
        }
        // replace content
        container.replaceChildren(
            createAnchorDiv(internalUrl, true),
            createAnchorDiv(externalUrl),
        );
    }

    /** creates an anchor element, wrapped in a div, that distinguishes between internal and external urls */
    function createAnchorDiv(url, internal) {
        const div = document.createElement("div");
        const anchor = document.createElement("a");
        // todo: remove the "internal" arg and simply check if the url starts with the fdp root url
        if (internal) {
            anchor.href = updateFdpUrlSearchParam(url);
        } else {
            anchor.href = url;
            anchor.target = "_blank";
        }
        anchor.textContent = url;
        div.appendChild(anchor);
        return div;
    }

    /** returns a valid fdp url, requesting one from the user if not found in the url query */
    function getFdpUrl() {
        // here we assume that the fdp query param is a valid url if it exists...
        return getFdpUrlFromSearchParam() || getFdpUrlFromUser();
    }

    /** returns the value of the fdp query param, assuming this is a url */
    function getFdpUrlFromSearchParam() {
        // https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams#parsing_window.location
        const url = new URLSearchParams(window.location.search).get(PARAM_FDP);
        // update container
        container.innerText = url;
        return url;
    }

    /** returns a valid url from user input prompt */
    function getFdpUrlFromUser() {
        let url;
        while (!url) {
            try {
                // validate
                url = new URL(window.prompt("please specify a valid fdp url", "https://fdp.example.org")).href;
                console.debug("valid url entered: %s", url)
            } catch {
                // reset to try again
                url = null;
            }
        }
        // trigger navigation event with the updated query, but do not make a new history entry (replace the current one)
        navigation.navigate(updateFdpUrlSearchParam(url), {"history": "replace"});
        // return for convenience
        return url;
    }

    /** returns a url with the fdp parameter updated to the specified fdpUrl */
    function updateFdpUrlSearchParam(fdpUrl) {
        const location = new URL(window.location);
        location.searchParams.set("fdp", fdpUrl);
        return location.href;
    }
</script>

</body>
</html>
