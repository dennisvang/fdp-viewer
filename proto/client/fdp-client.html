<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FDP client</title>
    <link rel="stylesheet" type="text/css" href="fdp-client.css">
</head>
<body>

<div class="controls">
    <label>fdp url:</label>
    <input type="text" value="https://app.fairdatapoint.org/" placeholder="http://localhost" id="url-input">
</div>

<div class="container"></div>

<script type="module">
    import { updateFdp } from "./fdp-client.js";

    const container = document.querySelector('.container');
    const editUrl = document.querySelector("#url-input");

    // listen for url changes
    editUrl.addEventListener("change", (event) => {
        updateFdp(event.target.value, container);
    });

    // initialize
    editUrl.dispatchEvent(new Event("change"));
</script>

</body>
</html>
