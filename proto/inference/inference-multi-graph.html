<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>inference</title>
</head>
<body>

<script type="module">
    // https://github.com/rdfjs/N3.js/ (repo)
    // https://rdf.js.org/N3.js/ (docs)
    import { DataFactory, Parser, Reasoner, Store } from "https://unpkg.com/n3/browser/n3.esm.min.js";

    // constants
    const ROOT_URL = "http://localhost:8080";
    const DATA = `
@prefix dcterms: <http://purl.org/dc/terms/> .
@prefix dcat: <http://www.w3.org/ns/dcat#> .
@prefix fdp-o: <https://w3id.org/fdp/fdp-o#> .
@prefix owl: <http://www.w3.org/2002/07/owl#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix skos: <http://www.w3.org/2004/02/skos/core#> .

# copied from fdp-o
fdp-o:MetadataService
  a owl:Class ;
  rdfs:subClassOf dcat:DataService .

# copied from fdp-o
fdp-o:metadataCatalog
  a owl:ObjectProperty ;
  rdfs:subPropertyOf owl:topObjectProperty ;
  skos:closeMatch dcat:catalog .

# copied from dcat
dcat:catalog
  a owl:ObjectProperty ;
  rdfs:subPropertyOf dcterms:hasPart .

# dummy fdp metadata (incomplete on purpose)
<http://localhost:8080>
  a fdp-o:MetadataService;
  fdp-o:metadataCatalog <http://localhost:8080/catalog/some-id> .
`;

    const RULES = `
# infer subclass
{
  ?subject a ?object .
  ?object <http://www.w3.org/2000/01/rdf-schema#subClassOf> ?otherObject .
} => {
  ?subject a ?otherObject .
} .

# infer subproperty
{
  ?subject ?predicate ?object .
  ?predicate <http://www.w3.org/2000/01/rdf-schema#subPropertyOf> ?otherPredicate .
} => {
  ?subject ?otherPredicate ?object .
} .

# infer close match property
{
  ?subject ?predicate ?object .
  ?predicate <http://www.w3.org/2004/02/skos/core#closeMatch> ?otherPredicate .
} => {
  ?subject ?otherPredicate ?object .
} .
`;

    // main triple store
    const store = new Store();

    // parse turtle content into triple store
    const parser = new Parser({format: 'text/turtle'});
    const quads = parser.parse(DATA);
    // note we do this synchornously instead of passing a callback into parse() which would lead to async complexity
    quads.forEach((quad) => {
        // determine dedicated graph for each predicate, fall back on default graph
        let graph = DataFactory.defaultGraph();
        for (const prefix of ["http://www.w3.org/ns/dcat#", "https://w3id.org/fdp/fdp-o#"]) {
            if (quad.subject.id.startsWith(prefix)) {
                graph = DataFactory.namedNode(prefix);
                break;
            }
        }
        // add quad to store with dedicated graph
        store.add(DataFactory.quad(quad.subject, quad.predicate, quad.object, graph));
    });

    // apparently n3.js does not support reasoning over multiple graphs, so we create a union store to reason over,
    // then add the inferred statements back into the original store
    const unionStore = new Store();
    store.forEach(quad => unionStore.addQuad(
        // force default graph for all statements
        quad.subject, quad.predicate, quad.object, DataFactory.defaultGraph()
    ));

    // configure reasoner for the union triple store
    const reasoner = new Reasoner(unionStore);
    const rulesParser = new Parser({format: 'text/n3'});
    const rulesStore = new Store(rulesParser.parse(RULES));

    // apply reasoning to union triple store
    console.info("union store size before reasoning: " + unionStore.size);
    reasoner.reason(rulesStore);
    console.info("union store size after reasoning: " + unionStore.size);
    console.debug(unionStore);

    // show union store contents
    for (let quad of unionStore) {
        console.info(quad.subject.id, quad.predicate.id, quad.object.id, quad.graph.id)
    }

    // copy inferred statements back into main store
    unionStore.forEach(quad => {
            if (quad.subject.id.startsWith(ROOT_URL)) {
                store.addQuad(quad.subject, quad.predicate, quad.object, DataFactory.defaultGraph());
            }
        }
    );

    // query store for catalogs, using inferred dcterms predicate
    const catalogs = store.getObjects(
        DataFactory.namedNode(ROOT_URL),
        DataFactory.namedNode("http://purl.org/dc/terms/hasPart"),
        null,
    );

    // populate html page with results
    catalogs.forEach(obj => {
        const div = document.createElement("div");
        div.innerText = obj.id;
        document.body.appendChild(div);
    });

</script>

</body>
</html>
