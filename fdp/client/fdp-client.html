<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FDP client</title>
    <link rel="stylesheet" type="text/css" href="fdp-client.css">
</head>
<body>
<form>
    <label>
        fdp url:
        <input type="text" value="https://app.fairdatapoint.org/" placeholder="http://localhost" id="url">
    </label>
</form>
<div class="container"></div>

<script type="module">
    import { parseFromUrl, populate } from "./fdp-client.js";

    const url = document.querySelector("#url").value;
    const container = document.querySelector('.container');

    // main call
    parseFromUrl(url, 1).then(() => populate(container));
</script>

</body>
</html>
