<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FDP client</title>
    <link rel="stylesheet" type="text/css" href="fdp-client.css">
</head>
<body>

<div class="controls">
    <label>fdp url:</label>
    <input type="text" value="https://app.fairdatapoint.org/" placeholder="http://localhost" id="url-input">
</div>

<div class="container"></div>

<script type="module">
    import { parseFromUrl, populate } from "./fdp-client.js";

    const url = document.querySelector("#url").value;
    const container = document.querySelector('.container');

    // main call
    parseFromUrl(url, 1).then(() => populate(container, url));
</script>

</body>
</html>
