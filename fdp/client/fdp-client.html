<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FDP client</title>
    <link rel="stylesheet" type="text/css" href="fdp-client.css">
</head>
<body>

<div class="controls">
    <label>fdp url:</label>
    <input type="text" value="https://app.fairdatapoint.org/" placeholder="http://localhost" id="url-input">
</div>

<div class="container"></div>

<script type="module">
    import { parseFromFdpUrl, populate } from "./fdp-client.js";

    const container = document.querySelector('.container');
    const editUrl = document.querySelector("#url-input");

    // updates the whole thing when the user changes the url
    function urlListener(event) {
        parseFromFdpUrl(event.target.value).then(() => populate(container));
    }

    // add listener
    editUrl.addEventListener("change", urlListener);

    // initialize
    editUrl.dispatchEvent(new Event("change"));
</script>

</body>
</html>
